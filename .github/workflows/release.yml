name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: statehouse

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: Build and push worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-worker:${{ steps.meta.outputs.tag }}
      - name: Build and push scheduler
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: scheduler
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-scheduler:${{ steps.meta.outputs.tag }}

  migrate:
    needs: publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Apply warehouse migrations
        env:
          STATEHOUSE_WAREHOUSE_DSN: ${{ secrets.WAREHOUSE_DSN }}
        run: python scripts/migrate.py --check-only --directory migrations

  deploy:
    needs: [publish, migrate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll the scheduler and workers
        run: |
          aws ecs update-service \
            --cluster statehouse-${{ inputs.environment || 'staging' }} \
            --service statehouse-scheduler \
            --force-new-deployment
          aws ecs update-service \
            --cluster statehouse-${{ inputs.environment || 'staging' }} \
            --service statehouse-worker \
            --force-new-deployment
      - name: Wait for stability
        run: |
          aws ecs wait services-stable \
            --cluster statehouse-${{ inputs.environment || 'staging' }} \
            --services statehouse-scheduler statehouse-worker
