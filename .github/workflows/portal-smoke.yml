name: portal-smoke

# Portals change without telling us. This runs the shape checks against live
# pages every morning so a layout change is a red build rather than a week of
# quietly empty batches.

on:
  schedule:
    - cron: "20 11 * * 1-5"
  workflow_dispatch:
    inputs:
      jurisdictions:
        description: Comma-separated codes, or "all"
        required: false
        default: all

concurrency:
  group: portal-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,scraping]"
      - name: Probe portals
        id: probe
        env:
          STATEHOUSE_USER_AGENT: statehouse-smoke/1.0 (+ops@statehouse.internal)
          TARGETS: ${{ inputs.jurisdictions || 'all' }}
        run: python scripts/portal_smoke.py --jurisdictions "$TARGETS" --report reports/smoke.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-smoke
          path: reports/smoke.json
          retention-days: 30
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Portal smoke failed on ${new Date().toISOString().slice(0, 10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'portal-smoke',
              state: 'open',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['portal-smoke', 'ingest'],
                body: 'The scheduled portal shape check failed. See the run artifacts for the report.',
              });
            }
